name: CrossCheck
on: pull_request

permissions:
  contents: read
  id-token: write

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: zFinia/crosscheck@v0
        with:
          fail-on: new
          # A maintainer may instead apply the crosscheck:decision-change PR label.
          allow-contract-change: false
