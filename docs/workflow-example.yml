name: CrossCheck
on: pull_request

# The default path needs no permissions block and makes no network calls.
jobs:
  crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: zFinia/crosscheck@v0
        with:
          # Warn only (default). Use "new" to fail the check on contradictions
          # this pull request introduces.
          fail-on: none
